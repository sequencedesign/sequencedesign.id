<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SEQUENCE+ — Architecture & Interior Design</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Josefin+Sans:wght@200;300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1.5rem 4rem;
      font-family: 'Josefin Sans', sans-serif;
    }

    .logo-ring {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: #111;
      border: 1px solid #2a2a2a;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.5rem;
    }

    .brand-name {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: 26px;
      letter-spacing: 0.25em;
      color: #f0ede8;
      margin: 0 0 6px;
      text-align: center;
    }

    .brand-tagline {
      font-size: 10px;
      letter-spacing: 0.35em;
      color: #5a5650;
      text-align: center;
      margin: 0 0 6px;
      text-transform: uppercase;
    }

    .brand-location {
      font-size: 10px;
      letter-spacing: 0.2em;
      color: #3a3835;
      text-align: center;
      margin: 0 0 2.5rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-location::before,
    .brand-location::after {
      content: '';
      display: block;
      width: 24px;
      height: 0.5px;
      background: #2a2a2a;
    }

    .divider {
      width: 1px;
      height: 32px;
      background: linear-gradient(to bottom, transparent, #2a2a2a, transparent);
      margin-bottom: 2.5rem;
    }

    .links-stack {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 20px;
      background: transparent;
      border: 0.5px solid #222;
      border-radius: 2px;
      color: #c8c4be;
      text-decoration: none;
      font-family: 'Josefin Sans', sans-serif;
      font-size: 11px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      font-weight: 300;
      transition: border-color 0.3s, color 0.3s, background 0.3s;
      cursor: pointer;
    }

    .link-btn:hover {
      border-color: #888068;
      color: #f0ede8;
      background: #111;
    }

    .link-btn .icon {
      width: 18px;
      height: 18px;
      opacity: 0.5;
      flex-shrink: 0;
      transition: opacity 0.3s;
    }

    .link-btn:hover .icon {
      opacity: 0.9;
    }

    .link-btn .label { flex: 1; }

    .link-btn .arrow {
      font-size: 14px;
      color: #3a3835;
      transition: color 0.3s, transform 0.3s;
    }

    .link-btn:hover .arrow {
      color: #888068;
      transform: translateX(3px);
    }

    .footer-line {
      margin-top: 3.5rem;
      font-size: 9px;
      letter-spacing: 0.3em;
      color: #2a2a2a;
      text-align: center;
    }
  </style>
</head>
